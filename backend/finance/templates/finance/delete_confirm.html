{% extends 'core/base.html' %}
{% block title %}Confirm delete | Finance dashboard{% endblock %}
{% block content %}
<div class="container py-4 float-in">
  <div class="row justify-content-center">
    <div class="col-lg-7">
      <div class="card shadow-sm border-0">
        <div class="card-body p-4">
          <h1 class="h4 fw-bold mb-3">Confirm delete</h1>
          <p class="text-muted mb-4">This action is permanent. Are you sure you want to delete this record?</p>
          <div class="alert alert-warning" role="alert">
            {{ record_name }}
          </div>
          <form method="post" class="d-flex gap-2">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Delete record</button>
            <a class="btn btn-outline-secondary" href="{% url cancel_url_name %}">Cancel</a>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
